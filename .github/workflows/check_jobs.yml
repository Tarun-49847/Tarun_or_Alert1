name: LinkedIn Job Alerts

on:
  schedule:
    # Every 10 minutes, offset by 3 to avoid the :00/:10/:20 queue rush
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}   # keeps the manual "Run workflow" button

# Never let two runs overlap and race on seen_jobs.json
concurrency:
  group: job-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Run job monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit seen-jobs history
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs [skip ci]" || echo "No new jobs this cycle"
          git pull --rebase origin main || true
          git push || echo "Push skipped"
